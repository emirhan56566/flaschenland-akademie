<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin – Flaschenland Akademie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #17202a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      background: #14213d;
      color: white;
      padding: 22px 18px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .8;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button,
    .button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: #14213d;
      color: white;
    }

    button:disabled {
      opacity: .6;
    }

    .secondary {
      background: #65758b;
    }

    .danger {
      background: #9b1c1c;
    }

    .success {
      background: #def7ec;
      color: #03543f;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .error {
      background: #fde8e8;
      color: #9b1c1c;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .employee {
      border: 1px solid #e0e4e8;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .employee strong {
      font-size: 17px;
    }

    .employee-info {
      color: #65758b;
      margin-top: 5px;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      background: #def7ec;
      color: #03543f;
    }

    .badge.inactive {
      background: #fde8e8;
      color: #9b1c1c;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Flaschenland Akademie</h1>
  <p>Administrationsbereich</p>
</header>

<div class="container">

  <!-- ADMIN -->
  <div class="box">
    <h2>👋 Admin-Bereich</h2>

    <p id="adminInfo">
      Anmeldung wird geprüft...
    </p>

    <div class="top-actions">
      <button id="logoutButton" class="danger">
        Abmelden
      </button>

      <button id="academyButton" class="secondary">
        Akademie öffnen
      </button>
    </div>
  </div>


  <!-- MITARBEITER ANLEGEN -->
  <div class="box">

    <h2>👤 Mitarbeiter anlegen</h2>

    <div id="successMessage" class="success"></div>
    <div id="errorMessage" class="error"></div>

    <form id="employeeForm">

      <label for="fullName">
        Vollständiger Name
      </label>

      <input
        id="fullName"
        type="text"
        placeholder="z. B. Max Mustermann"
        required
      >


      <label for="username">
        Benutzername
      </label>

      <input
        id="username"
        type="text"
        placeholder="z. B. max.mustermann"
        autocomplete="off"
        required
      >


      <label for="password">
        Startpasswort
      </label>

      <input
        id="password"
        type="password"
        placeholder="Mindestens 8 Zeichen"
        autocomplete="new-password"
        minlength="8"
        required
      >


      <button
        id="createButton"
        type="submit">
        Mitarbeiter anlegen
      </button>

    </form>

  </div>


  <!-- MITARBEITER LISTE -->
  <div class="box">

    <h2>👥 Mitarbeiter</h2>

    <button
      id="refreshButton"
      class="secondary">
      Liste aktualisieren
    </button>

    <div
      id="employeeList"
      style="margin-top:18px;">
      Wird geladen...
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://crfdjcacsflrtqcmswnb.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_7ISVnjWTi346wyI7H4xwLg_gqOwheFZ";


  const {
    createClient
  } = supabase;


  const supabaseClient =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const adminInfo =
    document.getElementById("adminInfo");

  const employeeForm =
    document.getElementById("employeeForm");

  const createButton =
    document.getElementById("createButton");

  const employeeList =
    document.getElementById("employeeList");

  const successMessage =
    document.getElementById("successMessage");

  const errorMessage =
    document.getElementById("errorMessage");


  function showSuccess(text) {

    successMessage.textContent = text;
    successMessage.style.display = "block";
    errorMessage.style.display = "none";

  }


  function showError(text) {

    errorMessage.textContent = text;
    errorMessage.style.display = "block";
    successMessage.style.display = "none";

  }


  async function checkAdmin() {

    const {
      data: {
        user
      },
      error
    } =
      await supabaseClient.auth.getUser();


    if (error || !user) {

      window.location.href =
        "login.html";

      return false;

    }


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id, username, full_name, role, active"
        )
        .eq("id", user.id)
        .single();


    if (
      profileError ||
      !profile ||
      profile.role !== "admin" ||
      !profile.active
    ) {

      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";

      return false;

    }


    adminInfo.textContent =
      "Angemeldet als " +
      profile.full_name +
      " (" +
      profile.username +
      ")";


    return true;

  }


  async function loadEmployees() {

    employeeList.textContent =
      "Mitarbeiter werden geladen...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id, username, full_name, role, active, created_at"
        )
        .eq("role", "employee")
        .order(
          "full_name",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);

      employeeList.textContent =
        "Fehler beim Laden der Mitarbeiter.";

      return;

    }


    if (!data || data.length === 0) {

      employeeList.innerHTML =
        "<p>Noch keine Mitarbeiter angelegt.</p>";

      return;

    }


    employeeList.innerHTML = "";


    data.forEach(function(employee) {

      const div =
        document.createElement("div");

      div.className =
        "employee";


      const status =
        employee.active
          ? '<span class="badge">Aktiv</span>'
          : '<span class="badge inactive">Deaktiviert</span>';


      div.innerHTML =

        "<strong>" +
        escapeHtml(employee.full_name) +
        "</strong>" +

        '<div class="employee-info">' +
        "Benutzername: <b>" +
        escapeHtml(employee.username) +
        "</b><br>" +
        "Rolle: Mitarbeiter<br>" +
        status +
        "</div>" +

        '<div class="actions">' +

        '<button ' +
        'class="' +
        (employee.active
          ? "danger"
          : "secondary") +
        '" ' +
        'onclick="toggleEmployee(\'' +
        employee.id +
        '\',' +
        employee.active +
        ')">' +

        (employee.active
          ? "Deaktivieren"
          : "Aktivieren") +

        "</button>" +

        "</div>";


      employeeList.appendChild(div);

    });

  }


  async function toggleEmployee(
    id,
    currentStatus
  ) {

    const newStatus =
      !currentStatus;


    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .update({
          active: newStatus
        })
        .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Änderung konnte nicht gespeichert werden."
      );

      return;

    }


    await loadEmployees();

  }


  window.toggleEmployee =
    toggleEmployee;


  employeeForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      successMessage.style.display =
        "none";

      errorMessage.style.display =
        "none";


      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();


      const username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("password")
          .value;


      if (
        !fullName ||
        !username ||
        !password
      ) {

        showError(
          "Bitte alle Felder ausfüllen."
        );

        return;

      }


      createButton.disabled =
        true;

      createButton.textContent =
        "Wird angelegt...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient.functions.invoke(
            "create-employee",
            {
              body: {
                username: username,
                full_name: fullName,
                password: password
              }
            }
          );


        if (error) {

          console.error(error);

          showError(
            "Fehler beim Anlegen: " +
            error.message
          );

          return;

        }


        if (!data || !data.success) {

          showError(
            data?.error ||
            "Mitarbeiter konnte nicht angelegt werden."
          );

          return;

        }


        showSuccess(
          "✓ Mitarbeiter " +
          fullName +
          " wurde erfolgreich angelegt."
        );


        employeeForm.reset();


        await loadEmployees();

      }

      catch (error) {

        console.error(error);

        showError(
          "Unerwarteter Fehler: " +
          error.message
        );

      }

      finally {

        createButton.disabled =
          false;

        createButton.textContent =
          "Mitarbeiter anlegen";

      }

    }
  );


  document
    .getElementById("refreshButton")
    .addEventListener(
      "click",
      loadEmployees
    );


  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

      }
    );


  document
    .getElementById("academyButton")
    .addEventListener(
      "click",
      function() {

        window.location.href =
          "index.html";

      }
    );


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  async function start() {

    const isAdmin =
      await checkAdmin();


    if (!isAdmin) {
      return;
    }


    await loadEmployees();

  }


  start();

</script>

</body>
</html>
